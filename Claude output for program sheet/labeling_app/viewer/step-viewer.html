<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CAD Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f12;
    --surface: #141720;
    --surface2: #1c2030;
    --border: #252a3a;
    --accent: #4df0c0;
    --accent2: #5b8fff;
    --warn: #ff6b6b;
    --text: #e0e6f0;
    --text-dim: #6b7899;
    --axis-x: #ff4d4d;
    --axis-y: #4dff88;
    --axis-z: #4d9fff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    height: 52px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    z-index: 10;
  }

  .logo {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .logo span { color: var(--text-dim); }
  .divider { width: 1px; height: 24px; background: var(--border); }

  .file-info {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    flex: 1;
  }

  .file-info .name { color: var(--text); }

  .btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.05em;
    cursor: pointer;
    border-radius: 4px;
    transition: border-color 0.15s, background 0.15s, color 0.15s;
    text-transform: uppercase;
  }

  .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(77,240,192,0.06); }
  .btn.primary { border-color: var(--accent); color: var(--accent); background: rgba(77,240,192,0.08); }
  .btn.primary:hover { background: rgba(77,240,192,0.16); }

  .workspace {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    cursor: grab;
    position: relative;
    z-index: 1;
  }

  #canvas:active { cursor: grabbing; }
  body.face-select-mode #canvas { cursor: crosshair; }
  body.face-select-mode #canvas:active { cursor: crosshair; }

  #drop-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    background: var(--bg);
    z-index: 5;
    transition: opacity 0.3s;
  }

  #drop-overlay.hidden { opacity: 0; pointer-events: none; }

  .drop-zone {
    width: 380px;
    height: 220px;
    border: 2px dashed var(--border);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    transition: border-color 0.2s, background 0.2s;
    cursor: pointer;
    position: relative;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(77,240,192,0.04);
  }

  .drop-zone input {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
    width: 100%;
    height: 100%;
  }

  .drop-icon { width: 48px; height: 48px; opacity: 0.3; }

  .drop-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0.05em;
  }

  .drop-sub { font-size: 12px; color: var(--text-dim); }

  .supported-formats { display: flex; gap: 8px; }

  .fmt-badge {
    padding: 3px 8px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.08em;
  }

  #loading {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: rgba(13,15,18,0.92);
    z-index: 20;
  }

  #loading.visible { display: flex; }

  .spinner {
    width: 36px;
    height: 36px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }

  #gizmo {
    position: absolute;
    bottom: 24px;
    right: 24px;
    width: 100px;
    height: 100px;
    z-index: 10;
    pointer-events: none;
  }

  #controls-panel {
    position: absolute;
    bottom: 24px;
    left: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    z-index: 10;
    display: none;
  }

  #controls-panel.visible { display: block; }

  .panel-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 24px;
    margin-bottom: 6px;
    font-size: 11px;
  }

  .stat-label { color: var(--text-dim); font-family: 'IBM Plex Mono', monospace; }
  .stat-val { color: var(--text); font-family: 'IBM Plex Mono', monospace; font-weight: 500; }

  .controls-hint {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--text-dim);
    line-height: 1.8;
    font-family: 'IBM Plex Mono', monospace;
  }

  .controls-hint b { color: var(--text); font-weight: 500; }

  #toolbar {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: none;
    gap: 6px;
    z-index: 10;
  }

  #toolbar.visible { display: flex; }

  #error-msg {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,107,107,0.1);
    border: 1px solid var(--warn);
    color: var(--warn);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    padding: 8px 16px;
    border-radius: 4px;
    z-index: 30;
    display: none;
    white-space: nowrap;
  }

  #selection-info {
    position: absolute;
    top: 16px;
    left: 16px;
    max-width: min(320px, calc(100% - 32px));
    display: none;
    gap: 8px;
    align-items: center;
    padding: 8px 10px;
    border: 1px solid #f97316;
    border-radius: 4px;
    background: rgba(20, 23, 32, 0.94);
    color: #fff2e8;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    z-index: 12;
    pointer-events: none;
  }

  #selection-info.visible { display: flex; }
  #selection-info::before {
    content: '';
    width: 9px;
    height: 9px;
    flex: 0 0 auto;
    background: #f97316;
  }

  #box-select {
    position: fixed;
    border: 1px solid #f97316;
    background: rgba(249, 115, 22, 0.15);
    z-index: 15;
    display: none;
    pointer-events: none;
  }

  .workspace::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(36,42,60,0.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(36,42,60,0.4) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }
</style>
</head>
<body>

<header>
  <div class="logo">CAD<span>//</span>VIEW</div>
  <div class="divider"></div>
  <div class="file-info" id="header-file-info">No file loaded</div>
  <button class="btn primary" id="open-btn">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
    Open File
  </button>
  <button class="btn" id="reset-btn">Reset View</button>
  <input type="file" id="file-input" accept=".step,.stp" style="display:none">
</header>

<div class="workspace">
  <canvas id="canvas"></canvas>

  <div id="drop-overlay">
    <div class="drop-zone" id="drop-zone">
      <input type="file" id="drop-input" accept=".step,.stp">
      <svg class="drop-icon" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.5">
        <rect x="8" y="16" width="48" height="36" rx="4" stroke="currentColor"/>
        <path d="M8 24h48M20 16V8M32 16V8M44 16V8" stroke="currentColor"/>
        <path d="M26 36l6 6 6-6M32 42V30" stroke="currentColor" stroke-width="2"/>
      </svg>
      <div class="drop-title">DROP YOUR CAD FILE</div>
      <div class="drop-sub">or click to browse</div>
      <div class="supported-formats">
        <span class="fmt-badge">.STEP</span>
        <span class="fmt-badge">.STP</span>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text" id="loading-text">Initializing CAD kernel...</div>
  </div>

  <div id="error-msg"></div>
  <div id="selection-info"></div>
  <div id="box-select"></div>

  <div id="toolbar">
    <button class="btn" id="wireframe-btn">Wireframe</button>
    <button class="btn" id="shaded-btn">Shaded</button>
    <button class="btn" id="shaded-wire-btn">Shaded+Edges</button>
    <button class="btn" id="fit-btn">Fit All</button>
  </div>

  <div id="controls-panel">
    <div class="panel-title">Model Info</div>
    <div class="stat-row"><span class="stat-label">Vertices</span><span class="stat-val" id="stat-verts">—</span></div>
    <div class="stat-row"><span class="stat-label">Triangles</span><span class="stat-val" id="stat-tris">—</span></div>
    <div class="stat-row"><span class="stat-label">File</span><span class="stat-val" id="stat-file">—</span></div>
    <div class="controls-hint">
      <b>Rotate</b> · Left drag<br>
      <b>Pan</b> · Right drag<br>
      <b>Zoom</b> · Scroll wheel
    </div>
  </div>

  <canvas id="gizmo" width="100" height="100"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
// ─── State ───────────────────────────────────────────────────────────────────
let occt = null;
let scene, camera, renderer, mainGroup;
let isDragging = false, isRightDrag = false;
let prevMouse = { x: 0, y: 0 };
let spherical = { theta: 0.5, phi: 1.0, radius: 5 };
let panOffset = new THREE.Vector3();
let renderMode = 'shaded-wire';
let currentMeshes = [];
let currentFaces = [];
let modelBounds = null;
let pendingHighlight = null;
let interactionMode = 'orbit';
let pointerDown = null;
let boxSelectStart = null;
const raycaster = new THREE.Raycaster();
const pointerNdc = new THREE.Vector2();

const canvas       = document.getElementById('canvas');
const gizmoCanvas  = document.getElementById('gizmo');
const dropOverlay  = document.getElementById('drop-overlay');
const loadingEl    = document.getElementById('loading');
const loadingText  = document.getElementById('loading-text');
const errorEl      = document.getElementById('error-msg');
const fileInput    = document.getElementById('file-input');
const dropInput    = document.getElementById('drop-input');
const dropZone     = document.getElementById('drop-zone');
const toolbar      = document.getElementById('toolbar');
const controlsPanel= document.getElementById('controls-panel');
const headerInfo   = document.getElementById('header-file-info');
const selectionInfo= document.getElementById('selection-info');
const boxSelectEl  = document.getElementById('box-select');

// ─── Three.js ─────────────────────────────────────────────────────────────────
function initThree() {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x0d0f12, 1);

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(45, 1, 0.001, 10000);
  camera.position.set(5, 4, 5);
  camera.lookAt(0, 0, 0);

  const ambient = new THREE.AmbientLight(0xffffff, 0.45);
  scene.add(ambient);
  const dir1 = new THREE.DirectionalLight(0xffffff, 0.8);
  dir1.position.set(10, 20, 15);
  scene.add(dir1);
  const dir2 = new THREE.DirectionalLight(0x6090ff, 0.3);
  dir2.position.set(-10, -5, -10);
  scene.add(dir2);

  mainGroup = new THREE.Group();
  scene.add(mainGroup);

  const grid = new THREE.GridHelper(10, 20, 0x1c2030, 0x1c2030);
  scene.add(grid);

  resize();
  window.addEventListener('resize', resize);
  new ResizeObserver(resize).observe(canvas);
  animate();
}

function resize() {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

// ─── Camera orbit ─────────────────────────────────────────────────────────────
function updateCamera() {
  const { theta, phi, radius } = spherical;
  camera.position.set(
    panOffset.x + radius * Math.sin(phi) * Math.sin(theta),
    panOffset.y + radius * Math.cos(phi),
    panOffset.z + radius * Math.sin(phi) * Math.cos(theta)
  );
  camera.lookAt(panOffset);
}

function cancelDragState() {
  isDragging = false;
  pointerDown = null;
  if (boxSelectStart) {
    boxSelectStart = null;
    boxSelectEl.style.display = 'none';
  }
}

canvas.addEventListener('mousedown', e => {
  cancelDragState();
  if (e.shiftKey && interactionMode === 'select' && e.button === 0) {
    boxSelectStart = { x: e.clientX, y: e.clientY };
    updateBoxSelectRect(e.clientX, e.clientY);
    boxSelectEl.style.display = 'block';
    return;
  }
  isDragging = true;
  isRightDrag = e.button === 2;
  pointerDown = { x: e.clientX, y: e.clientY, button: e.button };
  prevMouse = { x: e.clientX, y: e.clientY };
});

canvas.addEventListener('contextmenu', e => e.preventDefault());

document.addEventListener('mouseleave', cancelDragState);
window.addEventListener('blur', cancelDragState);

function updateBoxSelectRect(clientX, clientY) {
  const left = Math.min(boxSelectStart.x, clientX);
  const top = Math.min(boxSelectStart.y, clientY);
  boxSelectEl.style.left = `${left}px`;
  boxSelectEl.style.top = `${top}px`;
  boxSelectEl.style.width = `${Math.abs(clientX - boxSelectStart.x)}px`;
  boxSelectEl.style.height = `${Math.abs(clientY - boxSelectStart.y)}px`;
}

window.addEventListener('mousemove', e => {
  if (boxSelectStart) {
    updateBoxSelectRect(e.clientX, e.clientY);
    return;
  }
  if (!isDragging) return;
  const dx = e.clientX - prevMouse.x;
  const dy = e.clientY - prevMouse.y;
  prevMouse = { x: e.clientX, y: e.clientY };

  if (isRightDrag) {
    const panSpeed = spherical.radius * 0.001;
    const right = new THREE.Vector3();
    right.crossVectors(camera.getWorldDirection(new THREE.Vector3()), camera.up).normalize();
    panOffset.addScaledVector(right, -dx * panSpeed);
    panOffset.addScaledVector(camera.up, dy * panSpeed);
  } else {
    spherical.theta -= dx * 0.007;
    spherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, spherical.phi - dy * 0.007));
  }
  updateCamera();
});

window.addEventListener('mouseup', e => {
  if (boxSelectStart) {
    const rect = {
      left: Math.min(boxSelectStart.x, e.clientX),
      right: Math.max(boxSelectStart.x, e.clientX),
      top: Math.min(boxSelectStart.y, e.clientY),
      bottom: Math.max(boxSelectStart.y, e.clientY),
    };
    boxSelectStart = null;
    boxSelectEl.style.display = 'none';
    if (rect.right - rect.left > 4 || rect.bottom - rect.top > 4) boxSelectFaces(rect);
    return;
  }
  const down = pointerDown;
  isDragging = false;
  pointerDown = null;
  if (!down || interactionMode !== 'select' || down.button !== 0) return;
  const travel = Math.hypot(e.clientX - down.x, e.clientY - down.y);
  if (travel <= 5) pickFace(e.clientX, e.clientY);
});

function boxSelectFaces(rect) {
  if (!currentFaces.length) return;
  const canvasRect = canvas.getBoundingClientRect();
  const cameraDir = camera.getWorldDirection(new THREE.Vector3());
  const point = new THREE.Vector3();
  const matches = [];
  currentFaces.forEach((face, index) => {
    face.bounds.getCenter(point);
    const toFace = point.clone().sub(camera.position).normalize();
    if (toFace.dot(cameraDir) <= 0) return;
    const projected = point.clone().project(camera);
    const screenX = canvasRect.left + (projected.x + 1) / 2 * canvasRect.width;
    const screenY = canvasRect.top + (1 - projected.y) / 2 * canvasRect.height;
    if (screenX >= rect.left && screenX <= rect.right && screenY >= rect.top && screenY <= rect.bottom) {
      matches.push(index);
    }
  });
  if (matches.length) {
    window.parent.postMessage({ type: 'facesBoxSelected', faceIndices: matches }, '*');
  }
}

function pickFace(clientX, clientY) {
  if (!currentMeshes.length) return;
  const rect = canvas.getBoundingClientRect();
  if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return;
  pointerNdc.x = ((clientX - rect.left) / rect.width) * 2 - 1;
  pointerNdc.y = -((clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(pointerNdc, camera);
  const intersections = raycaster.intersectObjects(currentMeshes.map(item => item.mesh), false);
  for (const intersection of intersections) {
    const triangleIndex = Number(intersection.faceIndex);
    const faceIndex = currentFaces.findIndex(face =>
      face.mesh === intersection.object &&
      triangleIndex >= face.firstTriangle &&
      triangleIndex <= face.lastTriangle
    );
    if (faceIndex >= 0) {
      window.parent.postMessage({ type: 'faceClicked', faceIndex }, '*');
      return;
    }
  }
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  spherical.radius *= 1 + e.deltaY * 0.001;
  spherical.radius = Math.max(0.01, Math.min(10000, spherical.radius));
  updateCamera();
}, { passive: false });

let lastTouchDist = null;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true; isRightDrag = false;
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: true });

canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && isDragging) {
    const dx = e.touches[0].clientX - prevMouse.x;
    const dy = e.touches[0].clientY - prevMouse.y;
    prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    spherical.theta -= dx * 0.007;
    spherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, spherical.phi - dy * 0.007));
    updateCamera();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    if (lastTouchDist) spherical.radius *= lastTouchDist / dist;
    lastTouchDist = dist;
    updateCamera();
  }
}, { passive: true });

canvas.addEventListener('touchend', () => { isDragging = false; lastTouchDist = null; });

// ─── Gizmo ────────────────────────────────────────────────────────────────────
const gizmoCtx = gizmoCanvas.getContext('2d');
const GIZMO_CENTER = 50, GIZMO_LEN = 36;

function drawGizmo() {
  const ctx = gizmoCtx;
  ctx.clearRect(0, 0, 100, 100);
  ctx.beginPath();
  ctx.arc(GIZMO_CENTER, GIZMO_CENTER, 44, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(20,23,32,0.85)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(37,42,58,0.8)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const mat = new THREE.Matrix4().extractRotation(camera.matrixWorldInverse);
  const axes = [
    { dir: new THREE.Vector3(1,0,0), color: '#ff4d4d', neg: '#7a1a1a', label: 'X' },
    { dir: new THREE.Vector3(0,1,0), color: '#4dff88', neg: '#1a7a3a', label: 'Y' },
    { dir: new THREE.Vector3(0,0,1), color: '#4d9fff', neg: '#1a407a', label: 'Z' },
  ];

  const projected = axes.map(a => {
    const v = a.dir.clone().applyMatrix4(mat);
    return { ...a, x: v.x * GIZMO_LEN, y: -v.y * GIZMO_LEN, depth: v.z };
  });

  [...projected].sort((a, b) => a.depth - b.depth).forEach(({ x, y, depth, color, neg, label }) => {
    const isBack = depth < 0;
    const cx = GIZMO_CENTER + x;
    const cy = GIZMO_CENTER + y;
    ctx.globalAlpha = isBack ? 0.5 : 1.0;
    ctx.beginPath();
    ctx.moveTo(GIZMO_CENTER, GIZMO_CENTER);
    ctx.lineTo(cx, cy);
    ctx.strokeStyle = isBack ? neg : color;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx, cy, isBack ? 4 : 5, 0, Math.PI * 2);
    ctx.fillStyle = isBack ? neg : color;
    ctx.fill();
    if (!isBack) {
      ctx.font = 'bold 10px IBM Plex Mono, monospace';
      ctx.fillStyle = color;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(label, GIZMO_CENTER + x * 1.4, GIZMO_CENTER + y * 1.4);
    }
  });

  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(GIZMO_CENTER, GIZMO_CENTER, 3, 0, Math.PI * 2);
  ctx.fillStyle = '#ffffff';
  ctx.fill();
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
  drawGizmo();
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
function showLoading(msg) {
  loadingEl.classList.add('visible');
  loadingText.textContent = msg || 'Loading...';
}

function hideLoading() {
  loadingEl.classList.remove('visible');
}

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  setTimeout(() => { errorEl.style.display = 'none'; }, 6000);
}

// ─── occt-import-js init ──────────────────────────────────────────────────────
async function initOcct() {
  showLoading('Initializing CAD kernel...');
  try {
    // occt-import-js: purpose-built STEP/IGES reader with bundled OCC resources
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/occt-import-js.js';
    document.head.appendChild(script);
    await new Promise((resolve, reject) => {
      script.onload = resolve;
      script.onerror = () => reject(new Error('Failed to load occt-import-js from CDN'));
    });

    occt = await occtimportjs({
      locateFile: name => `https://cdn.jsdelivr.net/npm/occt-import-js@0.0.18/dist/${name}`
    });
    hideLoading();
  } catch (e) {
    hideLoading();
    showError('Failed to load CAD kernel: ' + e.message);
  }
}

// ─── STEP Loading ─────────────────────────────────────────────────────────────
async function loadSTEP(file) {
  if (!occt) { showError('CAD kernel not ready'); return; }
  showLoading('Reading STEP file...');

  try {
    const buffer = await file.arrayBuffer();
    const uint8 = new Uint8Array(buffer);

    loadingText.textContent = 'Parsing geometry...';
    await new Promise(r => setTimeout(r, 50));

    const result = occt.ReadStepFile(uint8, null);

    if (!result.success) {
      throw new Error('STEP parse failed — file may be corrupt or unsupported');
    }

    loadingText.textContent = 'Building mesh...';
    await new Promise(r => setTimeout(r, 50));

    // Clear previous model
    while (mainGroup.children.length) mainGroup.remove(mainGroup.children[0]);
    currentMeshes = [];
    currentFaces = [];

    let totalVerts = 0, totalTris = 0;

    // result.meshes is a flat array; result.root.meshes contains indices into it
    const buildMesh = (meshData) => {
      if (!meshData || !meshData.attributes || !meshData.attributes.position) return;

      const posArr = new Float32Array(meshData.attributes.position.array);
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.BufferAttribute(posArr, 3));

      if (meshData.attributes.normal) {
        geom.setAttribute('normal', new THREE.BufferAttribute(new Float32Array(meshData.attributes.normal.array), 3));
      }
      if (meshData.index) {
        geom.setIndex(new THREE.BufferAttribute(new Uint32Array(meshData.index.array), 1));
      }
      if (!meshData.attributes.normal) geom.computeVertexNormals();

      totalTris += meshData.index ? meshData.index.array.length / 3 : posArr.length / 9;
      totalVerts += posArr.length / 3;

      const makeMaterial = () => new THREE.MeshPhongMaterial({
        color: 0x7ab8d4,
        specular: 0x334466,
        shininess: 60,
        side: THREE.DoubleSide,
      });
      const materials = [makeMaterial()];
      const indexArray = geom.index.array;
      const position = geom.getAttribute('position');
      const edges = new THREE.Group();
      const firstCurrentFace = currentFaces.length;

      if (Array.isArray(meshData.brep_faces) && meshData.brep_faces.length) {
        geom.clearGroups();
        meshData.brep_faces.forEach((face, faceOffset) => {
          const firstTriangle = Number(face.first);
          const lastTriangle = Number(face.last);
          const material = makeMaterial();
          materials.push(material);
          geom.addGroup(firstTriangle * 3, (lastTriangle - firstTriangle + 1) * 3, faceOffset + 1);

          const faceIndexArray = indexArray.slice(firstTriangle * 3, (lastTriangle + 1) * 3);
          const faceGeometry = new THREE.BufferGeometry();
          faceGeometry.setAttribute('position', position);
          faceGeometry.setIndex(new THREE.BufferAttribute(faceIndexArray, 1));
          const faceEdges = new THREE.LineSegments(
            new THREE.EdgesGeometry(faceGeometry, 15),
            new THREE.LineBasicMaterial({ color: 0x1a2a3a })
          );
          edges.add(faceEdges);

          const bounds = new THREE.Box3();
          const point = new THREE.Vector3();
          for (let indexOffset = 0; indexOffset < faceIndexArray.length; indexOffset++) {
            point.fromBufferAttribute(position, faceIndexArray[indexOffset]);
            bounds.expandByPoint(point);
          }
          currentFaces.push({
            material,
            edges: faceEdges,
            bounds,
            mesh: null,
            firstTriangle,
            lastTriangle,
          });
        });
      } else {
        const faceEdges = new THREE.LineSegments(
          new THREE.EdgesGeometry(geom, 15),
          new THREE.LineBasicMaterial({ color: 0x1a2a3a })
        );
        edges.add(faceEdges);
        currentFaces.push({
          material: materials[0],
          edges: faceEdges,
          bounds: new THREE.Box3().setFromBufferAttribute(position),
          mesh: null,
          firstTriangle: 0,
          lastTriangle: Math.max(indexArray.length / 3 - 1, 0),
        });
      }

      const mesh = new THREE.Mesh(geom, materials.length > 1 ? materials : materials[0]);
      for (let faceIndex = firstCurrentFace; faceIndex < currentFaces.length; faceIndex++) {
        currentFaces[faceIndex].mesh = mesh;
      }

      const group = new THREE.Group();
      group.add(mesh);
      group.add(edges);
      mainGroup.add(group);
      currentMeshes.push({ mesh, edges, group });
    };

    const walkNode = (node) => {
      if (node.meshes) {
        for (const idx of node.meshes) buildMesh(result.meshes[idx]);
      }
      if (node.children) node.children.forEach(walkNode);
    };

    walkNode(result.root);

    if (currentMeshes.length === 0) {
      throw new Error('No geometry found in file');
    }

    // Fit view to model
    const box = new THREE.Box3().setFromObject(mainGroup);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3()).length();
    modelBounds = box.clone();

    panOffset.copy(center);
    spherical.radius = size * 1.5;
    updateCamera();

    // Update grid
    scene.children.filter(c => c instanceof THREE.GridHelper).forEach(g => scene.remove(g));
    const gridSize = size * 2;
    const grid = new THREE.GridHelper(gridSize, 20, 0x1c2030, 0x1c2030);
    grid.position.y = box.min.y;
    scene.add(grid);

    document.getElementById('stat-verts').textContent = Math.round(totalVerts).toLocaleString();
    document.getElementById('stat-tris').textContent = Math.round(totalTris).toLocaleString();
    document.getElementById('stat-file').textContent = file.name;
    headerInfo.innerHTML = `<span class="name">${file.name}</span> &nbsp;·&nbsp; ${(file.size / 1024).toFixed(1)} KB &nbsp;·&nbsp; ${Math.round(totalTris).toLocaleString()} triangles`;

    applyRenderMode(renderMode);
    toolbar.classList.add('visible');
    controlsPanel.classList.add('visible');
    dropOverlay.classList.add('hidden');
    hideLoading();
    window.parent.postMessage({
      type: 'viewerReady',
      faceCount: currentFaces.length,
      meshCount: currentMeshes.length,
    }, '*');
    if (pendingHighlight) {
      applyHighlight(pendingHighlight);
      pendingHighlight = null;
    }

  } catch (e) {
    hideLoading();
    showError('Error: ' + e.message);
    console.error(e);
  }
}

// ─── Render modes ─────────────────────────────────────────────────────────────
function applyRenderMode(mode) {
  renderMode = mode;
  currentMeshes.forEach(({ mesh, edges }) => {
    const setEdgeColor = (color) => {
      edges.traverse(child => {
        if (child.material?.color) child.material.color.set(color);
      });
    };
    if (mode === 'wireframe') {
      mesh.visible = false;
      edges.visible = true;
      setEdgeColor(0x4df0c0);
    } else if (mode === 'shaded') {
      mesh.visible = true;
      edges.visible = false;
    } else {
      mesh.visible = true;
      edges.visible = true;
      setEdgeColor(0x1a2a3a);
    }
  });
}

// ─── Event wiring ─────────────────────────────────────────────────────────────
document.getElementById('open-btn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => { if (e.target.files[0]) loadSTEP(e.target.files[0]); });
dropInput.addEventListener('change', e => { if (e.target.files[0]) loadSTEP(e.target.files[0]); });

dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const f = e.dataTransfer.files[0];
  if (f && (f.name.endsWith('.step') || f.name.endsWith('.stp'))) loadSTEP(f);
  else showError('Only .step and .stp files are supported');
});

document.getElementById('reset-btn').addEventListener('click', () => {
  spherical = { theta: 0.5, phi: 1.0, radius: spherical.radius };
  panOffset.set(0, 0, 0);
  if (currentMeshes.length) {
    const box = new THREE.Box3().setFromObject(mainGroup);
    panOffset.copy(box.getCenter(new THREE.Vector3()));
    spherical.radius = box.getSize(new THREE.Vector3()).length() * 1.5;
  }
  updateCamera();
});

document.getElementById('wireframe-btn').addEventListener('click', () => applyRenderMode('wireframe'));
document.getElementById('shaded-btn').addEventListener('click', () => applyRenderMode('shaded'));
document.getElementById('shaded-wire-btn').addEventListener('click', () => applyRenderMode('shaded-wire'));
document.getElementById('fit-btn').addEventListener('click', () => {
  if (!currentMeshes.length) return;
  const box = new THREE.Box3().setFromObject(mainGroup);
  panOffset.copy(box.getCenter(new THREE.Vector3()));
  spherical.radius = box.getSize(new THREE.Vector3()).length() * 1.5;
  updateCamera();
});

// ─── Face highlighting via postMessage ────────────────────────────────────────
const DEFAULT_COLOR   = 0x7ab8d4;
const HIGHLIGHT_COLOR = 0xf97316;

function resetFaceAppearance() {
  currentFaces.forEach(({ material, edges }) => {
    material.color.set(DEFAULT_COLOR);
    material.emissive.set(0x000000);
    material.opacity = 1;
    material.transparent = false;
    material.depthWrite = true;
    edges.material.color.set(0x1a2a3a);
    edges.material.opacity = 1;
    edges.material.transparent = false;
    edges.renderOrder = 0;
  });
  selectionInfo.classList.remove('visible');
  selectionInfo.textContent = '';
  applyRenderMode(renderMode);
}

function focusFaces(ids) {
  if (!ids.size || !modelBounds) return;
  const selectedBounds = new THREE.Box3();
  let found = false;
  currentFaces.forEach(({ bounds }, index) => {
    if (!ids.has(index)) return;
    selectedBounds.union(bounds);
    found = true;
  });
  if (!found || selectedBounds.isEmpty()) return;
  const modelSize = modelBounds.getSize(new THREE.Vector3()).length();
  const selectedSize = selectedBounds.getSize(new THREE.Vector3()).length();
  panOffset.copy(selectedBounds.getCenter(new THREE.Vector3()));
  spherical.radius = Math.max(selectedSize * 2.4, modelSize * 0.16);
  updateCamera();
}

function applyHighlight(message) {
  if (!currentMeshes.length) {
    pendingHighlight = message;
    return;
  }
  const ids = new Set((message.faceIndices || []).map(Number));
  if (!ids.size) {
    resetFaceAppearance();
    return;
  }
  currentFaces.forEach(({ material, edges }, index) => {
    const hit = ids.has(index);
    material.color.set(hit ? HIGHLIGHT_COLOR : 0x26313a);
    material.emissive.set(hit ? 0x8a3300 : 0x000000);
    material.opacity = hit ? 1 : 0.12;
    material.transparent = !hit;
    material.depthWrite = hit;
    edges.material.color.set(hit ? 0xffb067 : 0x172027);
    edges.material.opacity = hit ? 1 : 0.08;
    edges.material.transparent = !hit;
    edges.renderOrder = hit ? 3 : 0;
  });
  const label = message.featureLabel || message.featureId || 'Selected feature';
  selectionInfo.textContent = `${label} · ${ids.size} face${ids.size === 1 ? '' : 's'}`;
  selectionInfo.classList.add('visible');
  if (message.fit !== false) focusFaces(ids);
}

window.addEventListener('message', (e) => {
  if (!e.data) return;
  if (e.data.type === 'highlight') {
    applyHighlight(e.data);
  } else if (e.data.type === 'setInteractionMode') {
    interactionMode = e.data.mode === 'select' ? 'select' : 'orbit';
    document.body.classList.toggle('face-select-mode', interactionMode === 'select');
  } else if (e.data.type === 'focusFaces') {
    focusFaces(new Set((e.data.faceIndices || []).map(Number)));
  } else if (e.data.type === 'setFeatureColors') {
    const colors = e.data.colors || {};
    const dimmedFaces = e.data.dimmedFaces ? new Set(e.data.dimmedFaces.map(Number)) : null;
    currentFaces.forEach(({ material, edges }, i) => {
      const colStr = colors[i] || '#7ab8d4';
      const color = new THREE.Color(colStr);
      if (dimmedFaces && !dimmedFaces.has(i)) {
        color.multiplyScalar(0.25);
      }
      material.color.copy(color);
      material.emissive.set(0x000000);
      material.opacity = 1;
      material.transparent = false;
      material.depthWrite = true;
      edges.material.color.set(0x1a2a3a);
      edges.material.opacity = 1;
      edges.material.transparent = false;
      edges.renderOrder = 0;
    });
    if (e.data.label) {
      selectionInfo.textContent = e.data.label;
      selectionInfo.classList.add('visible');
    } else {
      selectionInfo.classList.remove('visible');
      selectionInfo.textContent = '';
    }
  } else if (e.data.type === 'resetColors') {
    resetFaceAppearance();
  }
});

// ─── Boot ─────────────────────────────────────────────────────────────────────
initThree();
updateCamera();
initOcct();
</script>

<script>
// Auto-load STEP file from ?url= query parameter
(function() {
  const params = new URLSearchParams(window.location.search);
  const stepUrl = params.get('url');
  if (!stepUrl) return;
  const waitAndLoad = async () => {
    while (!occt) await new Promise(r => setTimeout(r, 200));
    try {
      const resp = await fetch(stepUrl);
      if (!resp.ok) throw new Error('Failed to fetch STEP file: ' + resp.status);
      const blob = await resp.blob();
      const filename = stepUrl.split('/').pop() || 'part.step';
      const file = new File([blob], filename, { type: 'application/octet-stream' });
      loadSTEP(file);
    } catch (e) {
      showError('Could not load STEP file: ' + e.message);
    }
  };
  waitAndLoad();
})();
</script>
